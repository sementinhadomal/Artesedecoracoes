<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Vitrine de Produtos | Artes e Decorações</title>
    <link rel="stylesheet" href="/dashboard-financeiro/style.css">
    <link rel="stylesheet" href="/dashboard-financeiro/leads.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/dashboard-financeiro/js/auth-check.js"></script>
    <style>
        .prod-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .prod-card-admin {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }

        .prod-card-admin:hover {
            border-color: #0E2954;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .prod-card-admin-img {
            height: 160px;
            background: #f8fafc;
            position: relative;
        }

        .prod-card-admin-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .prod-card-admin-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .prod-card-admin-body h4 {
            font-size: 1rem;
            color: #0E2954;
            margin-bottom: 6px;
        }

        .prod-card-admin-desc {
            font-size: 0.82rem;
            color: #64748b;
            line-height: 1.4;
            margin-bottom: 12px;
            flex: 1;
        }

        .prod-card-admin-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            margin-top: auto;
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h3 {
            color: #0E2954;
            font-size: 1.25rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #0E2954;
        }

        .btn-add-prod {
            background: #0E2954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-add-prod:hover {
            background: #1a4aa8;
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/img/logo.png" alt="Artes e Decorações Logo">
                <h2>Financeiro</h2>
            </div>

            <nav class="nav-section">
                <div class="nav-section-title">Geral</div>
                <a href="/dashboard-financeiro/index.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Página Principal</span>
                </a>
            </nav>

            <nav class="nav-section">
                <div class="nav-section-title">Site & Catálogo</div>
                <a href="/dashboard-financeiro/produtos.html" class="nav-item active">
                    <i class="fas fa-boxes"></i>
                    <span>Vitrine de Produtos</span>
                </a>
                <a href="/dashboard-financeiro/leads.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Cadastros e Contatos</span>
                    <span id="leads-badge" class="leads-badge" style="display:none;"></span>
                </a>
            </nav>

            <nav class="nav-section">
                <div class="nav-section-title">Integrações</div>
                <a href="/dashboard-financeiro/index.html" class="nav-item">
                    <i class="fas fa-sync-alt"></i>
                    <span>Bling ERP</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-container">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>Vitrine de Produtos</h1>
                    <div class="text-muted">Gerencie quais materiais aparecem no catálogo do site.</div>
                </div>
                <button class="btn-add-prod" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> Adicionar Novo Material
                </button>
            </header>

            <!-- Filters Bar -->
            <div class="glass-card leads-toolbar" style="margin-top: 25px;">
                <div class="leads-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="admin-search" placeholder="Buscar material por nome ou código...">
                </div>
                <div class="leads-filters">
                    <button class="filter-tag active" data-cat="all">Todos</button>
                    <button class="filter-tag" data-cat="pisos">🪵 Pisos</button>
                    <button class="filter-tag" data-cat="forros">🏗️ Forros</button>
                    <button class="filter-tag" data-cat="drywall">🧱 Drywall</button>
                    <button class="filter-tag" data-cat="divisorias">🚪 Divisórias</button>
                    <button class="filter-tag" data-cat="persianas">🪟 Persianas</button>
                    <button class="filter-tag" data-cat="papel-parede">🎨 Papel Parede</button>
                </div>
            </div>

            <!-- Products List Grid -->
            <div id="admin-prod-grid" class="prod-grid-admin">
                <!-- Injected via JS -->
            </div>
        </main>
    </div>

    <!-- Modal Form (Add / Edit) -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Adicionar Material</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="prod-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome do Material / Produto *</label>
                        <input type="text" id="prod-nome" required placeholder="Ex: Piso Laminado Durafloor">
                    </div>
                    <div class="form-group">
                        <label>Código / SKU *</label>
                        <input type="text" id="prod-sku" required placeholder="Ex: PISO-001">
                    </div>
                    <div class="form-group">
                        <label>Categoria *</label>
                        <select id="prod-categoria" required>
                            <option value="pisos">Pisos (Laminados / Vinílicos)</option>
                            <option value="forros">Forros (PVC / Modular)</option>
                            <option value="drywall">Drywall (Chapas / Perfis)</option>
                            <option value="divisorias">Divisórias (Eucatex / PVC)</option>
                            <option value="persianas">Persianas & Cortinas</option>
                            <option value="papel-parede">Papel de Parede</option>
                            <option value="ferramentas">Ferramentas & Acessórios</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Link da Imagem (URL) *</label>
                        <input type="url" id="prod-imagem" required placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <div class="form-group form-group-full">
                        <label>Descrição / Explicação do Produto *</label>
                        <textarea id="prod-descricao" rows="3" required placeholder="Descreva as qualidades, acabamento e onde é indicado..."></textarea>
                    </div>
                    <div class="form-group form-group-full">
                        <label>Variantes / Opções (Separe por vírgulas)</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="text" id="var-nome" placeholder="Nome da Variante (Ex: Cores)">
                            <input type="text" id="var-valores" placeholder="Valores (Ex: Carvalho, Nogueira, Ipê)">
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px;">
                    <button type="button" onclick="closeModal()" style="padding: 10px 18px; border-radius: 8px; border: 1px solid #cbd5e1; background: white; cursor: pointer;">Cancelar</button>
                    <button type="submit" style="padding: 10px 24px; border-radius: 8px; border: none; background: #0E2954; color: white; font-weight: 700; cursor: pointer;">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/vitrine-store.js"></script>
    <script>
        let currentProducts = getVitrineProducts();
        let activeCatFilter = "all";
        let searchFilter = "";

        function renderAdminProducts() {
            const grid = document.getElementById("admin-prod-grid");
            const filtered = currentProducts.filter(p => {
                const matchCat = activeCatFilter === "all" || p.categoria === activeCatFilter;
                const matchSearch = !searchFilter ||
                    (p.nome || "").toLowerCase().includes(searchFilter.toLowerCase()) ||
                    (p.sku || "").toLowerCase().includes(searchFilter.toLowerCase());
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; background: white; border-radius: 16px; border: 1px solid #e2e8f0;">
                        <i class="fas fa-box-open fa-3x" style="color: #cbd5e1; margin-bottom: 15px;"></i>
                        <h3>Nenhum material encontrado</h3>
                        <p style="color: #64748b;">Nenhum produto cadastrado para esse filtro.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const catMap = {
                    pisos: 'Pisos', forros: 'Forros', drywall: 'Drywall',
                    divisorias: 'Divisórias', persianas: 'Persianas',
                    'papel-parede': 'Papel de Parede', ferramentas: 'Ferramentas'
                };
                const catName = catMap[p.categoria] || p.categoria;
                const img = p.imagem || 'https://via.placeholder.com/400x300?text=Sem+Imagem';

                return `
                <div class="prod-card-admin">
                    <div class="prod-card-admin-img">
                        <span class="tipo-tag tipo-pf" style="position: absolute; top: 10px; left: 10px; z-index: 2;">${catName}</span>
                        <img src="${img}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/400x300?text=Imagem+Indisponivel'">
                    </div>
                    <div class="prod-card-admin-body">
                        <h4>${p.nome}</h4>
                        <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px;">SKU: ${p.sku}</div>
                        <div class="prod-card-admin-desc">${p.descricao ? (p.descricao.length > 70 ? p.descricao.substring(0, 70) + '...' : p.descricao) : ''}</div>
                        <div class="prod-card-admin-meta">
                            <button onclick="editProduct('${p.id}')" class="btn-action btn-view" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteProduct('${p.id}')" class="btn-action btn-delete" title="Excluir">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Filters
        document.querySelectorAll('.filter-tag').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCatFilter = btn.dataset.cat;
                renderAdminProducts();
            });
        });

        document.getElementById('admin-search').addEventListener('input', e => {
            searchFilter = e.target.value;
            renderAdminProducts();
        });

        // Modal Logic
        function openAddModal() {
            document.getElementById('modal-title').textContent = "Adicionar Novo Material";
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = "";
            document.getElementById('product-modal').classList.add('active');
        }

        function editProduct(id) {
            const p = currentProducts.find(item => item.id === id);
            if (!p) return;

            document.getElementById('modal-title').textContent = "Editar Material";
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nome').value = p.nome;
            document.getElementById('prod-sku').value = p.sku;
            document.getElementById('prod-categoria').value = p.categoria;
            document.getElementById('prod-imagem').value = p.imagem;
            document.getElementById('prod-descricao').value = p.descricao;

            if (p.variantes && p.variantes.length > 0) {
                document.getElementById('var-nome').value = p.variantes[0].nome || "";
                document.getElementById('var-valores').value = p.variantes[0].valores ? p.variantes[0].valores.join(', ') : "";
            } else {
                document.getElementById('var-nome').value = "";
                document.getElementById('var-valores').value = "";
            }

            document.getElementById('product-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value || ("prod-" + Date.now());
            const nome = document.getElementById('prod-nome').value.trim();
            const sku = document.getElementById('prod-sku').value.trim();
            const categoria = document.getElementById('prod-categoria').value;
            const imagem = document.getElementById('prod-imagem').value.trim();
            const descricao = document.getElementById('prod-descricao').value.trim();

            const varNome = document.getElementById('var-nome').value.trim();
            const varValores = document.getElementById('var-valores').value.trim();

            let variantes = [];
            if (varNome && varValores) {
                variantes.push({
                    nome: varNome,
                    valores: varValores.split(',').map(s => s.trim()).filter(Boolean)
                });
            }

            const catMap = {
                pisos: 'Pisos', forros: 'Forros', drywall: 'Drywall',
                divisorias: 'Divisórias', persianas: 'Persianas',
                'papel-parede': 'Papel de Parede', ferramentas: 'Ferramentas'
            };

            const newProd = {
                id: id,
                sku: sku,
                nome: nome,
                categoria: categoria,
                categoriaNome: catMap[categoria] || categoria,
                descricao: descricao,
                imagem: imagem,
                variantes: variantes
            };

            const existingIndex = currentProducts.findIndex(p => p.id === id);
            if (existingIndex >= 0) {
                currentProducts[existingIndex] = newProd;
            } else {
                currentProducts.unshift(newProd);
            }

            saveVitrineProducts(currentProducts);
            closeModal();
            renderAdminProducts();
        }

        function deleteProduct(id) {
            if (!confirm("Tem certeza que deseja remover este material da vitrine?")) return;
            currentProducts = currentProducts.filter(p => p.id !== id);
            saveVitrineProducts(currentProducts);
            renderAdminProducts();
        }

        renderAdminProducts();
    </script>
</body>

</html>
